; Infinite Hair 1.0.0 by shrouddeath - settings
; Changes take effect the next time the game starts.

[General]
; 1 = mod on, 0 = completely off
Enabled=1
; Only Arthur (player_zero). John's hair uses other models and is not handled.
OnlyArthur=1
; natural = hair grows like in the vanilla game (in-game time: waiting, sleeping,
;           travelling). Where the game stops - at its maximum, or a beard
;           without hair tonic - the mod keeps growing at the same pace, up to
;           the new maximum.
; turbo   = one step every GrowIntervalSeconds real seconds
GrowthMode=natural
; natural: in-game hours per length step the mod adds when the game doesn't grow
HoursPerStep=48
; turbo: real seconds per length step. Minimum 1.
GrowIntervalSeconds=30
; 0 = barber and camp shaving work normally, the hair grows back from there
; 1 = haircuts and shaves are undone at once
; (Outfit changes that reset long hair are always undone.)
LockBarber=0
; Short message in the lower left whenever the mod grows something
ShowNotifications=1

; Single parts on/off. MaxLength=0 = up to the longest available length
; (hair 29, chin beard 29, mustache 17, sideburns 14). A smaller number caps growth.
[Hair]
Enabled=1
MaxLength=0
[BeardChin]
Enabled=1
MaxLength=0
[BeardMustache]
Enabled=1
MaxLength=0
[BeardChops]
Enabled=1
MaxLength=0

[Keys]
; F1-F24, Home, End, PageUp, PageDown, Insert, Delete, a single letter or digit,
; or a virtual key code (0x7A). Empty = off. Avoid F8 if you use ScriptHookRDR2 .NET
; (it opens its console).
Toggle=F10
DumpComponents=F9
; Grow one step right now
GrowNow=End
; Test: cut hair and beard to the shortest length at once, then they grow back
TestCut=Delete

[Extra]
; Additional custom drawables (advanced). Comma-separated, game naming scheme.
Drawables=

[Chains]
; Lengths beyond the game's maximum. The game ignores new model names, so these
; lengths live in the slots of styles Arthur normally doesn't use (they are
; replaced by the files in lml/InfiniteHair/stream). Picking those styles at the
; barber shows the long versions. Format: virtual length = borrowed slot.
; Don't edit unless you also rebuild the matching .ydd/.yld files.
;
; Hair (style "swept back", no pomade): lengths 10-29 on styles 07/08
